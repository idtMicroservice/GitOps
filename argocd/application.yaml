apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: industrial-digital-twin-demo
spec:
  project: industrial-digital-twin
  source:
    repoURL: https://github.com/Devops-communityy/industrial-digital-twin.git
    targetRevision: main
    path: deployment/gitops/overlays/demo
  destination:
    server: https://kubernetes.default.svc
    namespace: idt-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m