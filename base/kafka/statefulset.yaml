apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kafka
          image: docker.redpanda.com/redpandadata/redpanda:v24.1.10
          command:
          - rpk
          args:
          - redpanda
          - start
          - --smp=1
          - --memory=512M
          - --reserve-memory=0M
          - --overprovisioned
          - --node-id=0
          - --check=false
          - --kafka-addr=PLAINTEXT://0.0.0.0:9092
          - --advertise-kafka-addr=PLAINTEXT://kafka:9092
          ports:
            - name: kafka
              containerPort: 9092
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            tcpSocket:
              port: kafka
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: kafka
          livenessProbe:
            tcpSocket:
              port: kafka
          volumeMounts:
            - name: data
              mountPath: /var/lib/redpanda/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi