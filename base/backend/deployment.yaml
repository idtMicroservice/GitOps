apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: manojkrishnappa/idt-backend:52a8202
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MQTT_HOST
              valueFrom:
                configMapKeyRef:
                  name: idt-config
                  key: MQTT_HOST
            - name: MQTT_PORT
              valueFrom:
                configMapKeyRef:
                  name: idt-config
                  key: MQTT_PORT
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: idt-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: KAFKA_TELEMETRY_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: idt-config
                  key: KAFKA_TELEMETRY_TOPIC
            - name: KAFKA_CONSUMER_GROUP
              valueFrom:
                configMapKeyRef:
                  name: idt-config
                  key: KAFKA_CONSUMER_GROUP
            - name: JWT_ALGORITHM
              valueFrom:
                configMapKeyRef:
                  name: idt-config
                  key: JWT_ALGORITHM
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: idt-config
                  key: CORS_ORIGINS
            - name: DEMO_SIMULATION_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: idt-config
                  key: DEMO_SIMULATION_ENABLED
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: idt-auth
                  key: JWT_SECRET
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http